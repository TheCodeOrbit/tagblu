version: '3.8'

services:
  web:
    image: webdevops/php-apache:8.1
    ports:
      - "8080:80"
    volumes:
      - ./:/app
    environment:
      - WEB_DOCUMENT_ROOT=/app
      - PHP_DISPLAY_ERRORS=1
    depends_on:
      - db
      
  db:
    image: mariadb:10.5
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=deshwal
    volumes:
      - db_data:/var/lib/mysql
      
volumes:
  db_data:
